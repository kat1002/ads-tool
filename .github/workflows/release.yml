name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v$(jq -r .version manifest.json)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $(jq -r .version manifest.json)"
            exit 1
          fi
      - name: Zip extension
        run: |
          zip -r ads-tool-extension.zip manifest.json background.js ads-tool.html ads-tool.js jszip.min.js icons             install-updater.bat uninstall-updater.bat             updater/updater-host.bat updater/host.py updater/install.py updater/uninstall.py
          sha256sum ads-tool-extension.zip | cut -d' ' -f1 > ads-tool-extension.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ads-tool-extension
          path: |
            ads-tool-extension.zip
            ads-tool-extension.zip.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ads-tool-extension.zip
            ads-tool-extension.zip.sha256

  windows-exe:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exe
      - name: Check tag matches helper version
        shell: bash
        run: |
          v=$(grep -m1 '^VERSION = ' store-helper.py | cut -d'"' -f2)
          if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $v in store-helper.py (exe branch)"
            exit 1
          fi
      - name: Build AdsTool.exe
        shell: bash
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --name AdsTool --clean --add-data "ads-tool.html;." store-helper.py
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/AdsTool.exe --clobber
